{{ define "main" }}
<article>
    <header>
        {{- if not .Date.IsZero }}
        <p class="post-meta">
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006" }}</time>
        </p>
        {{- end }}
        <h1>{{ .Title }}</h1>
        {{- with .Params.description }}
        <p class="post-subtitle">{{ . | markdownify }}</p>
        {{- end }}
    </header>

    {{ .Content }}

    {{- with .Params.tags }}
    <footer>
        {{ partial "tags.html" $ }}
    </footer>
    {{- end }}
</article>
{{ end }}
