{{ define "main" }}
{{ partial "page-header.html" . }}

<section class="tags-index" aria-label="All tags">
    {{- range .Data.Terms.Alphabetical }}
    <a class="tag-card" href="{{ .Page.RelPermalink }}">
        <span class="tag-name">{{ .Page.Title }}</span><span class="tag-count">{{ .Count }}</span>
    </a>
    {{- end }}
</section>
{{ end }}
